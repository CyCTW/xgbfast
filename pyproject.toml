[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xgbfast"
version = "0.3.0"
description = "Compile XGBoost trees once and predict through a small native runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
compiler = ["xgboost>=3.0,<4", "treelite>=4.1,<5", "tl2cgen==1.0.0"]

[project.scripts]
xgbfast = "xgbfast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xgbfast = ["adapter.c", "include/*.h", "include/*.hpp"]
